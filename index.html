<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Seatwork 1</title>
    <style>
        /* Light pink theme styling */
        body {
            background-color: #fff0f5;
            color: #5a3d4a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glowing-orb {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ffb6c1 0%, #ff69b4 100%);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 20px #ffb6c1;
        }
        .main-title {
            color: #d87093;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
        .sub-title {
            color: #a07a8a;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 30px;
        }
        .glass-panel {
            background-color: #ffffff;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
            max-width: 500px;
            margin: 0 auto;
        }
        .form-control {
            background-color: #fffafb;
            border: 1px solid #ffb6c1;
            color: #5a3d4a;
            margin-bottom: 15px;
        }
        .form-control:focus {
            background-color: #ffffff;
            color: #5a3d4a;
            border-color: #ff69b4;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
        }
        .btn-submit {
            background-color: #ff69b4;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #ff1493;
            width: 100%;
            padding: 10px;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #ff1493;
            color: white;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
        }
        #result {
            max-width: 500px;
            margin: 20px auto 0 auto;
            background-color: #ffe4e1;
            border-left: 5px solid #ff69b4;
            color: #d87093;
            font-size: 1rem;
            padding: 20px;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
        }
        .footer {
            text-align: center;
            color: #a07a8a;
            font-size: 0.8rem;
            margin-top: 40px;
            border-top: 1px solid #ffb6c1;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-5 pt-4">
        <div class="glowing-orb"></div>
        <h1 class="main-title">ICT CLUB CHECKER</h1>
        <p class="sub-title">Candidate Verification System</p>

        <div class="glass-panel">
            <form>
                <div class="mb-3">
                    <input type="text" id="first_name" class="form-control" placeholder="Enter First Name" autocomplete="off">
                </div>
                <div class="mb-3">
                    <input type="text" id="last_name" class="form-control" placeholder="Enter Last Name" autocomplete="off">
                </div>
                <input type="button" value="ENTER" py-click="candidate_checker" class="btn btn-submit">
            </form>
        </div>

        <div id="result">Awaiting verification...</div>
        
        <div class="footer">
            &copy; 2026 ICT Club - Seatwork 1 - 2nd Quarter
        </div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
